# Shared workstation settings. Distances: metres; angles: radians; color: RGBA.
# Paths are relative to this project. Restart the session after scene/robot edits.
# network: used for real control; exported environment variables override these.
# simulation.world: open.world or cell.world (cell adds the surrounding walls).
# object: runtime name stays rect_object to match the planner/replay workflow.
# object.pose: [x, y, z, roll, pitch, yaw] in the world frame.
# object.mesh: null uses a box; set assets/models/tofu_real.stl to use the mesh.
# mesh_scale scales the mesh to metres. Collision geometry remains a box.
# add_to_real_scene: optionally add the object's collision box to real MoveIt.
# environment: simulation updates only models included by the selected world;
# real control adds every enabled environment box to its planning scene.
# planning: targets and tuning from the original planner; edits affect new plans.
network:
  pc_ip: 10.9.11.1
  nuc_ip: 10.9.11.186
  nuc_user: user
  nuc_container: dexterous_hand
  ssh_key: ~/.ssh/shadow_nuc
  ur5_ip: 192.168.1.10
  ur5_reverse_ip: ''
  ros_port: 11311
simulation:
  world: assets/worlds/open.world
  gui: true
trajectories:
  # Each planning run creates YYYY-MM-DD_HH-MM-SS/arm and /hand (Asia/Tokyo).
  # Replay latest completed run, or enter a specific timestamp folder name.
  replay_run: 2026-11-10_13-35-00
