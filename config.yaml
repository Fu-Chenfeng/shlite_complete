# Shared workstation settings. Distances: metres; angles: radians; color: RGBA.
# Paths are relative to this project. Restart the session after scene/robot edits.
# network: used for real control; exported environment variables override these.
# simulation.world: shared simulation/real environment; cell.world adds walls.
# object: runtime name stays rect_object to match the planner/replay workflow.
# object.pose: [x, y, z, roll, pitch, yaw] in the world frame.
# object.mesh uses the imported GraspIt mesh in millimetres; mesh_scale converts to metres.
# collision_mesh: true uses the same mesh for Gazebo and optional real MoveIt collisions.
# add_to_real_scene: optionally add the configured object to real MoveIt.
# environment: simulation updates only models included by the selected world;
# real control uses the same world selection and removes unselected environment boxes.
# grasp: world-frame palm pose and two hand targets. Joint angles are radians.
network:
  pc_ip: 10.9.11.1
  nuc_ip: 10.9.11.186
  nuc_user: user
  nuc_container: dexterous_hand
  ssh_key: ~/.ssh/shadow_nuc
  ur5_ip: 192.168.1.10
  ur5_reverse_ip: ''
  ros_port: 11311
simulation:
  world: assets/worlds/open.world
  gui: true
  # Replay motion speed only; real control and planning keep their normal timing.
  replay_speed: 3.0
  # Smaller steps reduce closed-finger shaking during arm motion; reset to apply.
  # Seconds: 0.00025 = 0.25 ms (more CPU); original setting was 0.001.
  physics_step: 0.00025
trajectories:
  # GraspIt runs use the input filename stem (grasps, grasps_001, ...).
  # Manual runs use YYYY-MM-DD_HH-MM-SS (Asia/Tokyo); each has arm/ and hand/.
  # Replay a completed five-stage run; old recordings are kept but not reinterpreted.
  replay_run: latest
robot:
  # UR5 mounting height above world Z=0 (table top), metres; restart to apply.
  # Example: 0.032 raises the base by 2 cm from its current 0.012 m height.
  initial_z: 0.012
  initial_y: 0.0
  # UR5 arm home joint angles, radians (simulation startup and stage 5).
  home_joints:
    ra_shoulder_pan_joint: -0.873
    ra_shoulder_lift_joint: -2.094
    ra_elbow_joint: 2.094
    ra_wrist_1_joint: -0.873
    ra_wrist_2_joint: -0.611
    ra_wrist_3_joint: -3.142
object:
  # World-Z offset applied only to the object and grasp target (metres).
  grasp_z_offset: 0.015
  enabled: true
  model: assets/models/tofuprintfinal/model.sdf
  pose: [0.41, 0.0, 0.034472, 1.5707963267948966, 0, 0]
  static: true
  mass: 0.5
  visual_size: [0.0432183, 0.068001, 0.0899252]
  collision_size: [0.0432183, 0.068001, 0.0899252]
  # Planning Stage 1 always checks hand-object collisions; this controls planning stages 2–5.
  # Replay disables other collision pairs; real replay always checks robot-table collisions.
  # Gazebo physical contacts use this setting for the entire session.
  hand_collision: false
  color: [0.88, 0.88, 0.83, 1.0]
  mesh: assets/models/tofuprintfinal/tofuprintfinal.stl
  mesh_scale: [0.001, 0.001, 0.001]
  add_to_real_scene: true
  collision_mesh: true
environment:
- name: ground_plane_user
  enabled: true
  size: [0.9, 0.66, 0.002]
  pose: [0.14, 0, -0.001, 0, 0, 0]
- name: cell_plane_user
  enabled: true
  size: [0.9, 0.66, 0.002]
  pose: [0.14, 0, 0.951, 0, 0, 0]
- name: back_plane_user
  enabled: true
  size: [0.002, 0.66, 0.95]
  pose: [-0.31, 0, 0.475, 0, 0, 0]
- name: side_plane_right
  enabled: true
  size: [0.9, 0.002, 0.95]
  pose: [0.14, -0.33, 0.475, 0, 0, 0]
- name: side_plane_left
  enabled: true
  size: [0.9, 0.002, 0.95]
  pose: [0.14, 0.33, 0.475, 0, 0, 0]
grasp:
  # graspit reads the JSON/TXT below; manual uses the pose and joint maps below.
  mode: graspit
  capture_file: grasps2.json             # Path relative to this project.
  capture_index: 0                     # Zero-based index in the JSON grasps list.
  capture_tighten_degrees: 7.0        # Stage 3 adds this to FF/MF/RF/TH J2 (before the tip).
  # Extra tightening is capped at joint limits; planning reports any reduced increment.
  frame: world
  hand_link: rh_palm
  translation: [0.34100592749911035, -0.010426620623213072, 0.09594225828885045]
  orientation: [0.4026467431013437, 0.49784906485097036, 0.5312893123372578, 0.554755419525667]
  # Stage 1 fully prepares THJ5, THJ4 and all finger J4 joints before arm motion.
  # Other joints first move partway toward the grasp (planning.approach_hand_fraction).
  # Captured 261110.txt posture; distal finger coupling is J1 = 0.8 * J2.
  joint_angles:
    rh_FFJ1: 0.15000000000000002
    rh_FFJ2: 0.1875
    rh_FFJ3: 1.570796
    rh_FFJ4: 0.325817
    rh_MFJ1: 0.219
    rh_MFJ2: 0.27375
    rh_MFJ3: 1.570796
    rh_MFJ4: 0.0
    rh_RFJ1: 0.1907744
    rh_RFJ2: 0.238468
    rh_RFJ3: 1.570796
    rh_RFJ4: -0.3490658503988659
    rh_THJ1: 1.089207
    rh_THJ2: 0.6981317007977318
    rh_THJ4: 1.22173
    rh_THJ5: -0.96449
  # Legacy manual-only stage-3 targets; ignored in graspit mode, which adds to J2 above.
  tightened_joint_angles:
    rh_FFJ1: 0.324532925199433
    rh_FFJ2: 0.1875
    rh_FFJ3: 1.570796
    rh_FFJ4: 0.325817
    rh_MFJ1: 0.39353292519943295
    rh_MFJ2: 0.27375
    rh_MFJ3: 1.570796
    rh_MFJ4: 0.0
    rh_RFJ1: 0.365307325199433
    rh_RFJ2: 0.238468
    rh_RFJ3: 1.570796
    rh_RFJ4: -0.3490658503988659
    rh_THJ1: 1.263739925199433
    rh_THJ2: 0.6981317007977318
    rh_THJ4: 1.22173
    rh_THJ5: -0.96449
planning:
  # Stage 1: adjust this fraction from 0.0 to 1.0 (0.6 = 60%, 0.8 = 80%).
  # Applies to remaining joints; thumb base THJ5/THJ4 and finger J4 always reach 100%.
  approach_hand_fraction: 0.55
  # Search different arm configurations for the same palm position and orientation.
  approach_ik_attempts: 64
  approach_ik_timeout: 0.1  # Seconds per starting guess.
  arm_velocity: 0.08
  arm_acceleration: 0.08
  hand_velocity: 0.4
  hand_acceleration: 0.4
  planning_time: 60.0
  planning_attempts: 5
  joint_tolerance: 0.01
  # Lift along world +Z; unreachable endpoints are reported before moving.
  lift_distance: 0.2
  # Rotate during the lift so the captured gravity direction points world-down.
  lift_align_gravity: true
  lift_rotation_step_degrees: 2.0
  lift_step: 0.005
  lift_min_fraction: 1.0
  # Lift-only speed scaling; approach and home keep arm_velocity/arm_acceleration.
  lift_velocity: 0.10
  lift_acceleration: 0.10
  lift_min_duration: 16.0
